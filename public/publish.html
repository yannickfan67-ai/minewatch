<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minewatch | Add a camera</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><nav class="nav"><span class="brand"><img src="https://minewatchrecreation.neocities.org/imgs/logo.png" alt="">MineWatch</span><a href="/">Home</a><a href="/cameras.html">Cameras</a><a href="/guide.html">Guide</a><a href="/guestbook.html">Guestbook</a><a href="/addcamera.html">Add a camera</a></nav><div class="announcement">No recent announcements to display.</div><div class="content wide"><section class="panel"><h1>Share a camera</h1><p class="small">Browser publisher for testing the P2P camera system.</p><div class="two"><div><label>Title <input id="camTitle" value="Minecraft camera"></label><br><label>Visibility <select id="visibility"><option value="public">Public</option><option value="unlisted">Unlisted</option></select></label><br><label>Max viewers <input id="maxViewers" type="number" min="1" max="8" value="4"></label><br><label>Bitrate kbps <input id="bitrate" type="number" min="250" max="2500" value="900"></label><br><label><input id="relayOnly" type="checkbox"> Relay-only</label><br><label><input id="audio" type="checkbox"> Include audio</label><br><label>Invite secret <input id="secret" type="password"></label></div><div><div class="video-wrap"><video id="preview" autoplay muted playsinline></video></div></div></div><div class="row"><button id="start">START CAMERA</button><button id="stop" disabled>STOP</button><button id="copy" disabled>COPY WATCH LINK</button></div><div id="result" class="code">Not live.</div></section></div><footer class="footer"><strong>Minewatch</strong><span>Minewatch © 2024</span><br><span>We are not responsible for any kind of usage.</span><a class="back" href="#top">Back to top</a></footer></main><script type="module">import{api,wsUrl}from'/common.js';let stream,ws,camera,iceServers=[],peers=new Map(),peerId=crypto.randomUUID();const result=document.querySelector('#result'),start=document.querySelector('#start'),stop=document.querySelector('#stop'),copy=document.querySelector('#copy'),preview=document.querySelector('#preview'),audio=document.querySelector('#audio'),secret=document.querySelector('#secret'),camTitle=document.querySelector('#camTitle'),visibility=document.querySelector('#visibility'),maxViewers=document.querySelector('#maxViewers'),bitrate=document.querySelector('#bitrate'),relayOnly=document.querySelector('#relayOnly');async function iceConfig(){const x=await api(`/api/camera/${camera.id}/ice`);iceServers=x.iceServers}async function newPeer(viewer){const pc=new RTCPeerConnection({iceServers,iceTransportPolicy:camera.relayOnly?'relay':'all'});peers.set(viewer,pc);for(const track of stream.getTracks())pc.addTrack(track,stream);pc.onicecandidate=e=>{if(e.candidate&&ws?.readyState===1)ws.send(JSON.stringify({type:'ice',target:viewer,candidate:e.candidate}))};for(const sender of pc.getSenders()){if(sender.track?.kind==='video'){try{const p=sender.getParameters();p.encodings=p.encodings?.length?p.encodings:[{}];p.encodings[0].maxBitrate=camera.bitrateKbps*1000;await sender.setParameters(p)}catch(_){}}}const offer=await pc.createOffer();await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'offer',target:viewer,sdp:pc.localDescription}))}start.onclick=async()=>{start.disabled=true;try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:15,max:20}},audio:audio.checked});preview.srcObject=stream;const headers={'content-type':'application/json'};if(secret.value)headers.authorization=`Bearer ${secret.value}`;camera=await api('/api/cameras',{method:'POST',headers,body:JSON.stringify({title:camTitle.value,visibility:visibility.value,maxViewers:maxViewers.value,relayOnly:relayOnly.checked,bitrateKbps:bitrate.value})});await iceConfig();ws=new WebSocket(wsUrl(`/ws/${camera.id}?role=publisher&peer=${encodeURIComponent(peerId)}&token=${encodeURIComponent(camera.token)}`));ws.onopen=()=>{result.textContent=`● LIVE\nCAM ${camera.id}\n${location.origin}/camera.html?id=${camera.id}\nmode: ${camera.relayOnly?'relay-only':'direct P2P'}\nmax viewers: ${camera.maxViewers}`;stop.disabled=false;copy.disabled=false};ws.onmessage=async ev=>{const m=JSON.parse(ev.data);if(m.type==='viewer-join')await newPeer(m.peerId);else if(m.type==='viewer-leave'){const p=peers.get(m.peerId);p?.close();peers.delete(m.peerId)}else if(m.type==='answer'){const p=peers.get(m.from);if(p)await p.setRemoteDescription(m.sdp)}else if(m.type==='ice'){const p=peers.get(m.from);if(p&&m.candidate)try{await p.addIceCandidate(m.candidate)}catch(_){}}};stream.getVideoTracks()[0].onended=()=>stop.click()}catch(e){alert(e.message);stream?.getTracks().forEach(t=>t.stop());start.disabled=false}};stop.onclick=async()=>{try{if(camera)await api(`/api/camera/${camera.id}/stop`,{method:'POST',headers:{authorization:`Bearer ${camera.token}`}})}catch(_){}ws?.close();peers.forEach(p=>p.close());peers.clear();stream?.getTracks().forEach(t=>t.stop());preview.srcObject=null;result.textContent='Not live.';camera=null;stop.disabled=true;copy.disabled=true;start.disabled=false};copy.onclick=async()=>{if(camera)await navigator.clipboard.writeText(`${location.origin}/camera.html?id=${camera.id}`)};</script></body></html>
