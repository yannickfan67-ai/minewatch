<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera - MineWatch</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><nav class="nav"><span class="brand">◉ MineWatch</span><a href="/">Home</a><a href="/cameras.html">Cameras</a><a href="/publish.html">Share</a><a href="/guide.html">Guide</a></nav>
<section class="panel"><h2 id="title">CAMERA</h2><div class="statusline"><span id="conn">CONNECTING…</span><span id="viewers">VIEWERS ?</span></div><div class="video-wrap"><video id="video" autoplay playsinline controls></video><div id="signal" class="muted">Waiting for publisher…</div></div><div class="row"><button id="random">Random</button><button id="report">Report</button><span id="mode" class="muted"></span></div></section>
<section class="panel"><h3>Chat</h3><div id="chat" class="chat"></div><form id="chatForm" class="row"><input id="name" maxlength="24" placeholder="anonymous"><input id="msg" maxlength="240" placeholder="message" style="flex:1"><button>Send</button></form></section></main>
<script type="module">
import {api,wsUrl,esc} from '/common.js';
const id=Number(new URLSearchParams(location.search).get('id'));
if(!Number.isInteger(id)){ location.href='/cameras.html'; }
let meta, ws, pc, peerId=crypto.randomUUID(), iceServers=[];
const video=document.querySelector('#video'), signal=document.querySelector('#signal'), conn=document.querySelector('#conn'), viewers=document.querySelector('#viewers'), chat=document.querySelector('#chat');
function addChat(m){ const p=document.createElement('p'); p.innerHTML=`<span class="${m.role==='publisher'?'pub':''}">${esc(m.name)}</span>: ${esc(m.text)}`; chat.appendChild(p); chat.scrollTop=chat.scrollHeight; }
async function makePC(){ if(pc) return pc; pc=new RTCPeerConnection({iceServers, iceTransportPolicy:meta.relayOnly?'relay':'all'}); pc.ontrack=e=>{video.srcObject=e.streams[0]; signal.style.display='none';}; pc.onicecandidate=e=>{if(e.candidate) ws.send(JSON.stringify({type:'ice',target:'publisher',candidate:e.candidate}));}; pc.onconnectionstatechange=()=>{conn.textContent=pc.connectionState.toUpperCase();}; return pc; }
async function start(){ try{ const d=await api(`/api/camera/${id}`); meta=d.camera; title.textContent=`CAMERA #${id} — ${meta.title}`; mode.textContent=meta.relayOnly?'RELAY ONLY':'DIRECT P2P + TURN FALLBACK'; const ice=await api(`/api/camera/${id}/ice`); iceServers=ice.iceServers; ws=new WebSocket(wsUrl(`/ws/${id}?role=viewer&peer=${encodeURIComponent(peerId)}`)); ws.onopen=()=>conn.textContent='SIGNAL CONNECTED'; ws.onclose=()=>conn.textContent='SIGNAL CLOSED'; ws.onmessage=async ev=>{ const m=JSON.parse(ev.data); if(m.type==='hello'){ viewers.textContent=`VIEWERS ${m.viewers}`; } else if(m.type==='viewer-count'){viewers.textContent=`VIEWERS ${m.viewers}`;} else if(m.type==='publisher-offline'){signal.style.display='block';signal.textContent='SIGNAL LOST';video.srcObject=null;} else if(m.type==='offer'){ const p=await makePC(); await p.setRemoteDescription(m.sdp); const answer=await p.createAnswer(); await p.setLocalDescription(answer); ws.send(JSON.stringify({type:'answer',target:m.from,sdp:p.localDescription})); } else if(m.type==='ice'){ const p=await makePC(); if(m.candidate) try{await p.addIceCandidate(m.candidate)}catch(_){} } else if(m.type==='chat-history'){ m.messages.forEach(addChat); } else if(m.type==='chat'){addChat(m.message);} } }catch(e){signal.textContent=e.message;conn.textContent='ERROR';}}
chatForm.onsubmit=e=>{e.preventDefault();if(!ws||ws.readyState!==1)return;const text=msg.value.trim();if(!text)return;ws.send(JSON.stringify({type:'chat',name:name.value||'anonymous',text}));msg.value='';};
random.onclick=async()=>{try{const r=await api('/api/random');location.href=`/camera.html?id=${r.id}`}catch(_){alert('No online camera')}};
report.onclick=async()=>{const detail=prompt('Describe the issue (optional):')||'';try{await api(`/api/camera/${id}/report`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reason:'user_report',detail})});alert('Reported.')}catch(e){alert(e.message)}};
start();
</script></body></html>
