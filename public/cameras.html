<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minewatch | Cameras</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><nav class="nav"><span class="brand"><img src="https://minewatchrecreation.neocities.org/imgs/logo.png" alt="">MineWatch</span><a href="/">Home</a><a href="/cameras.html">Cameras</a><a href="/guide.html">Guide</a><a href="/guestbook.html">Guestbook</a><a href="/addcamera.html">Add a camera</a></nav><div class="announcement">No recent announcements to display.</div><div class="content wide"><section class="panel" style="width:min(510px,86vw);margin-left:auto;margin-right:auto"><h1>Cameras</h1><p>Here you can choose a camera to watch.</p><p>Sort by: <select id="sort"><option>Most popular</option><option>Newest</option><option>Oldest</option></select></p><p>Alternatively...<br><a id="random" href="#">Random camera</a></p></section><div id="grid" class="grid"></div><div class="page-controls"><button>&lt;</button><span>Page 1</span><button>&gt;</button></div></div><footer class="footer"><strong>Minewatch</strong><span>Minewatch © 2024</span><br><span>We are not responsible for any kind of usage.</span><a class="back" href="#top">Back to top</a></footer></main><script type="module">import{api,esc}from'/common.js';const grid=document.querySelector('#grid');const historic=[['1111','Trees',1],['1221','bamboo',4],['2121','',7],['2425','',2],['2633','',5],['2342','',8],['2233','',3],['3001','',6],['1211','random base',9]];const preview=n=>`https://minewatchrecreation.neocities.org/cameras/preview/${n}.png`;function card(c,i,demo=false){const el=document.createElement('div');el.className='card';const pic=demo?historic[i]?.[2]||((i%9)+1):((i%9)+1);el.innerHTML=`<div class="thumb"><img src="${preview(pic)}" alt="Camera ${esc(c.id)}"></div><div class="cardbar">ID: ${esc(c.id)}<span class="state"></span></div>`;el.onclick=()=>location.href=`/camera.html?id=${encodeURIComponent(c.id)}${demo?'&demo=1':''}`;return el}function fallback(){grid.innerHTML='';historic.forEach((x,i)=>grid.appendChild(card({id:x[0],title:x[1]},i,true)))}async function load(){try{const{cameras=[]}=await api('/api/cameras');if(!cameras.length)return fallback();grid.innerHTML='';cameras.slice(0,9).forEach((c,i)=>grid.appendChild(card(c,i,false)));}catch(_){fallback()}}document.querySelector('#random').onclick=async e=>{e.preventDefault();try{const r=await api('/api/random');location.href=`/camera.html?id=${r.id}`}catch(_){const x=historic[Math.floor(Math.random()*historic.length)];location.href=`/camera.html?id=${x[0]}&demo=1`}};load();</script></body></html>
